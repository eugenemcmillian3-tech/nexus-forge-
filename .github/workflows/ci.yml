name: NEXUS FORGE CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nexus-forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Typecheck application and tests
        run: pnpm exec tsc --noEmit

      - name: Run automated tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

  artifact-benchmarks:
    name: Artifact DOM benchmarks v2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run artifact DOM benchmark suite v2
        run: pnpm exec vitest run __tests__/artifact-behavior-benchmark.test.ts --reporter=default --reporter=json --outputFile=artifact-dom-v2.json
      - name: Save benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifact-dom-v2-report
          path: artifact-dom-v2.json
          if-no-files-found: warn
