name: NEXUS FORGE CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nexus-forge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, test, audit, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Production dependency security audit
        run: pnpm audit --prod
      - name: Full dependency audit (development advisories reported separately)
        run: pnpm audit
        continue-on-error: true
      - name: Run automated tests
        run: pnpm test
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Build production bundle
        run: pnpm run build
