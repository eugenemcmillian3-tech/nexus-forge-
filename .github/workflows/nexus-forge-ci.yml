name: NEXUS FORGE CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "sync/macaly-source-2026-10-13"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-forge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, typecheck, security audit, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Enable pinned package manager
        run: corepack enable
      - name: Install dependencies from pnpm lockfile
        run: pnpm install --frozen-lockfile
      - name: Production dependency security audit
        run: pnpm audit --prod
      - name: Full dependency audit (development advisories reported separately)
        run: pnpm audit
        continue-on-error: true
      - name: Run test suite
        run: pnpm test -- --run
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm run build
