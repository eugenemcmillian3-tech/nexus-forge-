name: NEXUS FORGE CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "sync/macaly-source-2026-10-13"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-forge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, typecheck, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run test suite
        run: npm test -- --run
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
