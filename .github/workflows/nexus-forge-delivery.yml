name: NEXUS FORGE Delivery

on:
  workflow_dispatch:
    inputs:
      mission_id:
        description: 'NEXUS FORGE mission ID'
        required: true
        type: string
      delivery_id:
        description: 'NEXUS FORGE delivery ID'
        required: true
        type: string
      artifact_ref:
        description: 'Artifact or release reference to build'
        required: false
        type: string
        default: 'main'
  push:
    branches: [main]

permissions:
  contents: read

env:
  CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
  NEXUS_FORGE_DELIVERY_SECRET: ${{ secrets.NEXUS_FORGE_DELIVERY_SECRET }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --run
      - name: Persist delivery result to Convex
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DELIVERY_ID: ${{ inputs.delivery_id }}
          MISSION_ID: ${{ inputs.mission_id }}
          CONCLUSION: "success"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          [[ -n "$CONVEX_SITE_URL" ]] || { echo "Missing GitHub Actions secret: CONVEX_SITE_URL"; exit 1; }
          [[ -n "$NEXUS_FORGE_DELIVERY_SECRET" ]] || { echo "Missing GitHub Actions secret: NEXUS_FORGE_DELIVERY_SECRET"; exit 1; }
          payload=$(node -e 'console.log(JSON.stringify({deliveryId:process.env.DELIVERY_ID,conclusion:process.env.CONCLUSION,runUrl:process.env.RUN_URL,commitSha:process.env.COMMIT_SHA,summary:`Mission ${process.env.MISSION_ID}; GitHub Actions ${process.env.CONCLUSION}.`}))')
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "$CONVEX_SITE_URL/github-actions/delivery-result" \
            -H "Authorization: Bearer $NEXUS_FORGE_DELIVERY_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "Convex response ($STATUS): $(cat /tmp/response.json)"
          [[ "$STATUS" == "200" ]] || { echo "Failed to persist delivery result to Convex"; exit 1; }
      - name: Delivery evidence
        if: ${{ always() }}
        run: |
          echo "NEXUS FORGE delivery checks completed."
          echo "Commit: $GITHUB_SHA"
          echo "Mission: ${{ inputs.mission_id }}"
          echo "Delivery: ${{ inputs.delivery_id }}"
          echo "Artifact ref: ${{ inputs.artifact_ref }}"

  delivery-failure:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ failure() && github.event_name == 'workflow_dispatch' }}
    env:
      DELIVERY_ID: ${{ inputs.delivery_id }}
      MISSION_ID: ${{ inputs.mission_id }}
      CONCLUSION: "failure"
    steps:
      - name: Report failed delivery to Convex
        run: |
          [[ -n "$CONVEX_SITE_URL" ]] || { echo "Missing GitHub Actions secret: CONVEX_SITE_URL"; exit 1; }
          [[ -n "$NEXUS_FORGE_DELIVERY_SECRET" ]] || { echo "Missing GitHub Actions secret: NEXUS_FORGE_DELIVERY_SECRET"; exit 1; }
          payload=$(node -e 'console.log(JSON.stringify({deliveryId:process.env.DELIVERY_ID,conclusion:process.env.CONCLUSION,runUrl:"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",commitSha:"${{ github.sha }}",summary:`Mission ${process.env.MISSION_ID}; GitHub Actions ${process.env.CONCLUSION}.`}))')
          STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST "$CONVEX_SITE_URL/github-actions/delivery-result" \
            -H "Authorization: Bearer $NEXUS_FORGE_DELIVERY_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "Convex response ($STATUS): $(cat /tmp/response.json)"
          [[ "$STATUS" == "200" ]] || { echo "Failed to persist delivery result to Convex"; exit 1; }
