name: NEXUS FORGE Delivery

on:
  workflow_dispatch:
    inputs:
      mission_id:
        description: 'NEXUS FORGE mission ID'
        required: true
        type: string
      delivery_id:
        description: 'NEXUS FORGE delivery ID'
        required: true
        type: string
      artifact_ref:
        description: 'Artifact or release reference to build'
        required: false
        type: string
        default: 'main'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --run
      - name: Delivery evidence
        run: |
          echo "NEXUS FORGE delivery checks completed."
          echo "Commit: $GITHUB_SHA"
          echo "Mission: ${{ inputs.mission_id }}"
          echo "Delivery: ${{ inputs.delivery_id }}"
          echo "Artifact ref: ${{ inputs.artifact_ref }}"

  report-result:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    env:
      CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
      NEXUS_FORGE_DELIVERY_SECRET: ${{ secrets.NEXUS_FORGE_DELIVERY_SECRET }}
      DELIVERY_ID: ${{ inputs.delivery_id }}
      MISSION_ID: ${{ inputs.mission_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      COMMIT_SHA: ${{ github.sha }}
      CONCLUSION: ${{ needs.build-and-test.result }}
    steps:
      - name: Validate callback configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CONVEX_SITE_URL" ]] || { echo "Missing GitHub Actions secret: CONVEX_SITE_URL"; exit 1; }
          [[ -n "$NEXUS_FORGE_DELIVERY_SECRET" ]] || { echo "Missing GitHub Actions secret: NEXUS_FORGE_DELIVERY_SECRET"; exit 1; }
          [[ -n "$DELIVERY_ID" ]] || { echo "Missing workflow input: delivery_id"; exit 1; }

      - name: Persist delivery result to Convex
        shell: bash
        run: |
          set -euo pipefail
          payload=$(node -e 'console.log(JSON.stringify({deliveryId:process.env.DELIVERY_ID,conclusion:process.env.CONCLUSION,runUrl:process.env.RUN_URL,commitSha:process.env.COMMIT_SHA,summary:`Mission ${process.env.MISSION_ID}; GitHub Actions ${process.env.CONCLUSION}.`}))')
          curl --fail-with-body --silent --show-error \
            -X POST "$CONVEX_SITE_URL/github-actions/delivery-result" \
            -H "Authorization: Bearer $NEXUS_FORGE_DELIVERY_SECRET" \
            -H "Content-Type: application/json" \
            --data "$payload"

  deploy-note:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && needs.build-and-test.result == 'success' }}
    steps:
      - name: Deployment gate
        run: |
          echo "Build/test passed. Deployment remains governed by the NEXUS FORGE approval gate."
          echo "No deployment credential is stored in source control."
